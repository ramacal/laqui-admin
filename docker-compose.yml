# Local development services.
#   npm run db:up    -> start MySQL (localhost:3306) and file storage (localhost:8333)
#   npm run db:down  -> stop them (data is kept in named volumes)
services:
  mysql:
    image: mysql:8.4
    container_name: laqui-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-laqui_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-laqui}
      MYSQL_USER: ${MYSQL_USER:-laqui}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-laqui_dev}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "3306:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Local stand-in for Cloudflare R2 (SeaweedFS, S3-compatible). Like R2:
  #   - the S3 API (localhost:8333) always needs credentials, for both buckets;
  #   - public files are read from a separate public domain (storage-public, localhost:8334),
  #     the way R2 serves a bucket through r2.dev or a custom domain.
  # Buckets: laqui-public and laqui-private (signed URLs only). Create them with `npm run storage:init`.
  storage:
    image: chrislusf/seaweedfs:4.51
    container_name: laqui-storage
    restart: unless-stopped
    environment:
      # Local dev credentials only (an R2 API token in production).
      S3_CONFIG: >-
        {"identities":[
        {"name":"laqui-app","credentials":[{"accessKey":"${STORAGE_ACCESS_KEY:-laqui}","secretKey":"${STORAGE_SECRET_KEY:-laqui_dev_secret}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '%s' "$$S3_CONFIG" > /tmp/s3.json &&
        exec weed server -dir=/data -ip.bind=0.0.0.0 -volume.max=20
        -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "8333:8333"
    volumes:
      - storage-data:/data

  # The public bucket's domain (R2: r2.dev / custom domain). Read-only, files only:
  # no folder listings and nothing from laqui-private. Reads SeaweedFS's internal filer.
  storage-public:
    image: nginx:1.27-alpine
    container_name: laqui-storage-public
    restart: unless-stopped
    depends_on:
      - storage
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '%s' "$$NGINX_CONF" > /etc/nginx/conf.d/default.conf &&
        exec nginx -g 'daemon off;'
    environment:
      NGINX_CONF: >-
        server {
          listen 80;
          location ~ /$$ { return 404; }
          location / {
            limit_except GET { deny all; }
            set $$args '';
            proxy_pass http://storage:8888/buckets/laqui-public/;
            proxy_hide_header Server;
          }
        }
    ports:
      - "8334:80"

volumes:
  mysql-data:
  storage-data:
