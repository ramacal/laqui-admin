# Local development services.
#   npm run db:up    -> start MySQL (localhost:3306) and file storage (localhost:8333)
#   npm run db:down  -> stop them (data is kept in named volumes)
services:
  mysql:
    image: mysql:8.4
    container_name: laqui-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-laqui_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-laqui}
      MYSQL_USER: ${MYSQL_USER:-laqui}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-laqui_dev}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "3306:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object storage (SeaweedFS). Buckets: laqui-public (anonymous read)
  # and laqui-private (signed URLs only). Create them with `npm run storage:init`.
  storage:
    image: chrislusf/seaweedfs:4.51
    container_name: laqui-storage
    restart: unless-stopped
    environment:
      # Local dev credentials only. "anonymous" can read the public bucket.
      S3_CONFIG: >-
        {"identities":[
        {"name":"laqui-app","credentials":[{"accessKey":"${STORAGE_ACCESS_KEY:-laqui}","secretKey":"${STORAGE_SECRET_KEY:-laqui_dev_secret}"}],"actions":["Admin","Read","Write","List","Tagging"]},
        {"name":"anonymous","actions":["Read:laqui-public"]}]}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '%s' "$$S3_CONFIG" > /tmp/s3.json &&
        exec weed server -dir=/data -ip.bind=0.0.0.0 -volume.max=20
        -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "8333:8333"
    volumes:
      - storage-data:/data

volumes:
  mysql-data:
  storage-data:
