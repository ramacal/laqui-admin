# Local development database.
#   npm run db:up    -> start MySQL on localhost:3306
#   npm run db:down  -> stop it (data is kept in the "mysql-data" volume)
services:
  mysql:
    image: mysql:8.4
    container_name: laqui-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-laqui_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-laqui}
      MYSQL_USER: ${MYSQL_USER:-laqui}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-laqui_dev}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "3306:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
